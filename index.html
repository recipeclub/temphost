<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>One Seasonal Recipe, Every Friday</title>
  <meta name="description" content="One seasonal recipe. Zero ads. Sent from a small Cambridge kitchen to your inbox every Friday. Always free.">
  <meta property="og:title" content="One Seasonal Recipe, Every Friday">
  <meta property="og:description" content="Zero ads. Sent from a small Cambridge kitchen to your inbox every Friday. Always free.">
  <meta property="og:image" content="https://recipeclub.github.io/temphost/Cover.png">
  <style>
    html, body { min-height: 100%; margin: 0; }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.5rem;
      background: #9ed89d; /* matches image background */
      padding: 1.5rem 1rem;
      box-sizing: border-box;
      min-height: 100vh;
    }
    img { display: block; width: 100%; max-width: 900px; height: auto; border-radius: 12px; }
    .btn {
      display: inline-block;
      background: #fa6044; /* matches the heart */
      color: #000;
      font: 700 1.25rem/1 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      text-decoration: none;
      padding: 1rem 2.5rem;
      border-radius: 999px;
      border: 3px solid #000;
      transition: transform .15s ease, box-shadow .15s ease;
    }
    .btn:hover, .btn:focus-visible { transform: translateY(-2px); box-shadow: 0 4px 0 #000; }
    .btn:active { transform: translateY(0); box-shadow: none; }
  </style>
</head>
<body>
  <img src="Cover.png" alt="One seasonal recipe. Zero ads. Sent from a small Cambridge kitchen to your inbox every Friday. Always free.">
  <a class="btn" href="https://littlerecipes.substack.com/subscribe" target="_blank" rel="noopener">Sign up</a>
</body>
</html>
